[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Sprint D M3: gate global de coverage.
#
# Baseline medido em 2026-05-25 (pos-merge A+B+C, branch
# feat/sprint-D-coverage-baseline a partir de main 0fe9112):
#   TOTAL: 59% (13003 stmts, 5388 miss)
#
# Gate global definido em 55% (~4% de margem) para alarmar regressao
# grande sem bloquear refatoracao normal. Quando suite ultrapassar
# 65% de forma consistente, subir o gate para 60.
#
# Baseline por trilha (sprint dedicada deve elevar quem esta baixo):
#
#   Maduras (>= 80%):
#     src/web/auth_identity.py             100%
#     src/web/routes/med_onboarding.py     100%  (Sprint C MVP)
#     src/web/routes/acompanhamento.py     100%
#     src/web/routes/public_anchors.py     100%
#     src/web/pagination.py                 98%
#     src/services/template_engine.py       98%
#     src/services/regulatory_documents.py  96%
#     src/web/routes/regulatory_reporting.py 92%
#     src/web/routes/pharmacovigilance.py   88%
#     src/web/routes/document_reviews.py    87%
#     src/web/routes/patient_portal.py      83%
#     src/services/triage_intake_service.py 82%
#
#   Estaveis (60-79%):
#     src/web/routes/governance.py          79%
#     src/web/routes/admin_agents.py        75%
#     src/services/triage_link_service.py   74%
#     src/web/routes/compliance.py          73%
#     src/web/routes/realtime_notifications.py 72%
#     src/services/tenant_secrets.py        71%
#     src/web/routes/regulatory.py          69%
#     src/web/routes/auth.py                62%
#
#   Pendentes de uma sprint dedicada (< 50%):
#     src/web/routes/atendimentos.py        24%
#     src/web/routes/chat_intake.py         25%
#     src/web/routes/admin_users.py         27%
#     src/web/routes/tenant_admin.py        28%
#     src/web/routes/returns.py             28%
#     src/web/routes/reports.py             29%
#     src/web/routes/conversations.py       30%
#     src/web/routes/prescriptions.py       36%
#     src/web/routes/clinic_config.py       37%
#     src/web/routes/scheduling_chain.py    40%
#     src/web/routes/ai_admin.py            44%
#     src/web/routes/telemetry.py           46%
#     src/web/routes/dashboard.py           48%
#     src/services/tenant_service.py         0%  (modulo nao exercitado)
#     src/services/telemetry_crm_service.py  0%
#
# Para revisar baseline:
#   env/Scripts/python.exe -m pytest -q --no-header | grep -E "[0-9]+%"

addopts = -v --tb=short -p no:cacheprovider --cov=src --cov-report=term-missing --cov-fail-under=55
