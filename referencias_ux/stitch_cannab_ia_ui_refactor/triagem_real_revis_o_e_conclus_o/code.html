<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#36003e",
                        "surface-container": "#1a2211",
                        "on-primary-container": "#3e5200",
                        "on-surface-variant": "#c5c9b1",
                        "inverse-primary": "#4f6700",
                        "surface-variant": "#2f3824",

                        "surface-container-highest": "#2f3824",
                        "inverse-on-surface": "#2a3320",
                        "secondary-fixed": "#bfefbe",
                        "outline": "#8f937d",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#dce6cb",
                        "secondary": "#a4d2a4",
                        "tertiary-container": "#f998ff",
                        "on-tertiary": "#580064",
                        "primary-container": "#a3c93a",
                        "primary-fixed-dim": "#aed445",
                        "on-surface": "#dce6cb",
                        "on-secondary-container": "#96c496",
                        "on-primary": "#273500",
                        "surface-bright": "#333c29",
                        "on-secondary-fixed": "#002107",
                        "on-secondary-fixed-variant": "#274f2c",
                        "tertiary-fixed-dim": "#fcaaff",
                        "surface-container-low": "#161e0d",
                        "secondary-container": "#29522e",
                        "primary": "#bee654",
                        "on-primary-fixed": "#151f00",
                        "on-error": "#690005",
                        "surface-container-lowest": "#091003",
                        "on-secondary": "#0e3817",
                        "on-background": "#dce6cb",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#741e80",
                        "on-primary-fixed-variant": "#3a4d00",
                        "error": "#ffb4ab",
                        "surface-dim": "#0e1606",
                        "outline-variant": "#444937",
                        "background": "#0e1606",
                        "surface-tint": "#aed445",
                        "primary-fixed": "#c9f15e",
                        "tertiary": "#ffc4fe",
                        "surface-container-high": "#242d1a",
                        "surface": "#0e1606",
                        "tertiary-fixed": "#ffd6fc"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.glass-panel {
    background: rgba(47, 56, 36, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(143, 147, 125, 0.2)
    }
.bg-botanical {
    background-image: linear-gradient(to bottom, rgba(14, 22, 6, 0.92), rgba(14, 22, 6, 0.98)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuDOAFbBO4U_To9VvuiciDJa30m3hfq-MDXgHSC_vYgMg3NUdW3cw_Jev27bmDkxzHVUbwinuvyPN_Zf10QWdR-kbLbHofTkbNJOy7kShdURKKM3I6IalMbSiqwbzVAQC57X6OX4BWpe2kl0jUvZD0DxRA-h1dt210VpcAzVY7oU1d98DsS0L2SMdLFhL5aRBNL0FZrHT_2Lf5uHEqK2hCd36nSB3g0WbVjUJpIoOxYCA-03eqzrzX-StYMIGkvy3D3_cFi44ouV7bc2);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col bg-botanical" data-alt="Macro photography of dark green tropical leaves with intricate textures and soft cinematic lighting in a deep forest atmosphere">
<!-- TopAppBar Section -->
<header class="fixed top-0 w-full border-b border-stone-800/50 bg-stone-950/80 backdrop-blur-md z-50">
<div class="flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#A3C93A]">clinical_notes</span>
<span class="text-lg font-bold tracking-widest text-[#A3C93A] uppercase">Clinical Triage</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-stone-500">more_vert</span>
</div>
</div>
</header>
<main class="flex-1 pt-24 pb-32 px-6 flex flex-col items-center max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full mb-8">
<div class="flex justify-between items-end mb-3">
<span class="text-[#A3C93A] font-headline font-bold text-sm tracking-widest uppercase">Etapa 04 de 04</span>
<span class="text-on-surface-variant font-label text-xs uppercase tracking-tighter">100% Completo</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-full"></div>
</div>
</div>
<!-- Title Section -->
<h1 class="font-headline text-3xl font-light tracking-tight text-on-surface mb-8 leading-tight">
            Tudo pronto para a <span class="text-primary italic font-medium">análise</span> da nossa IA.
        </h1>
<!-- Summary Glassmorphism Card -->
<div class="glass-panel w-full rounded-lg p-6 mb-8 relative overflow-hidden group">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary/10 rounded-full blur-3xl group-hover:bg-primary/20 transition-all"></div>
<div class="flex items-center gap-3 mb-6 border-b border-outline-variant/30 pb-4">
<span class="material-symbols-outlined text-primary text-xl">fact_check</span>
<h2 class="font-headline font-semibold text-lg text-on-surface">Resumo da Triagem</h2>
</div>
<div class="space-y-6">
<div class="flex items-start justify-between gap-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-lg">medical_information</span>
<span class="text-on-surface-variant text-sm font-label uppercase tracking-wider">Motivo</span>
</div>
<span class="text-on-surface font-medium text-right">Controle de Dor</span>
</div>
<div class="flex items-start justify-between gap-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-lg">thermostat</span>
<span class="text-on-surface-variant text-sm font-label uppercase tracking-wider">Sintomas</span>
</div>
<div class="text-right">
<span class="text-on-surface font-medium">Dor</span>
<span class="text-error font-bold ml-1">(8/10)</span>
</div>
</div>
<div class="flex items-start justify-between gap-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-lg">fitness_center</span>
<span class="text-on-surface-variant text-sm font-label uppercase tracking-wider">Hábitos</span>
</div>
<span class="text-on-surface font-medium text-right">Ativo</span>
</div>
</div>
</div>
<!-- Main CTA -->
<button class="w-full bg-[#A3C93A] text-stone-950 font-headline font-extrabold text-lg py-5 rounded-lg shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3 mb-6">
            Finalizar Triagem
            <span class="material-symbols-outlined font-bold">check_circle</span>
</button>
<!-- Privacy Notice -->
<div class="flex items-center justify-center gap-2 text-stone-500 py-4">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="text-xs font-label tracking-wide uppercase">Dados protegidos por criptografia.</p>
</div>
</main>
<!-- BottomNavBar Section -->
<nav class="fixed bottom-0 w-full z-50 flex justify-between items-center px-10 py-6 pb-8 bg-stone-950/90 backdrop-blur-xl border-t border-stone-800/50 shadow-2xl shadow-black rounded-t-[2rem]">
<!-- Back Tab (Inactive) -->
<button class="flex flex-col items-center justify-center text-stone-400 p-2 hover:bg-[#A3C93A]/10 hover:text-[#A3C93A] transition-all duration-300">
<span class="material-symbols-outlined">arrow_back</span>
<span class="font-manrope text-xs font-semibold uppercase tracking-widest mt-1">Back</span>
</button>
<!-- Next/Finish Tab (Active - Determining intent for Finalizar step) -->
<button class="flex flex-col items-center justify-center bg-[#A3C93A] text-stone-950 rounded-full px-8 py-2 scale-95 active:duration-100 transition-all duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
<span class="font-manrope text-xs font-semibold uppercase tracking-widest mt-1">Next</span>
</button>
</nav>
<!-- Abstract Botanical Element Decor -->
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-[#A3C93A]/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed top-1/3 -right-20 w-48 h-48 bg-primary-container/10 rounded-full blur-[80px] pointer-events-none"></div>
</body></html>
