        body {

</div>

<main class="flex-grow w-full max-w-lg px-6 pt-24 pb-32 flex flex-col items-center">

<div class="w-full mb-10">
<div class="flex justify-between items-end mb-2">
<span class="text-xs font-bold text-primary tracking-widest uppercase font-headline">Conclusão</span>

</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-full rounded-full shadow-[0_0_12px_rgba(190,230,84,0.5)]"></div>
</div>
</div>
<!-- Central Glassmorphism Card -->
<div class="glass-card w-full rounded-lg p-8 shadow-2xl relative overflow-hidden">

<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[80px] rounded-full"></div>

<h1 class="text-3xl font-black text-on-background font-headline tracking-tight mb-2">Hábitos de Saúde</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">Conte-nos um pouco sobre sua rotina.</p>
</header>
<div class="space-y-12 relative z-10">
<!-- Toggle Switch Section -->
<div class="flex flex-col gap-6">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold text-on-surface tracking-wide">Você pratica atividades físicas regularmente?</label>
</div>
<div class="flex bg-surface-container-low p-1.5 rounded-full border border-white/5">

</div>
</div>

<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-on-surface tracking-wide">Qual a sua qualidade de sono (0-10)?</label>
<span class="text-2xl font-black text-primary font-headline">8</span>
</div>
<div class="relative pt-2">
<input class="custom-slider w-full h-2 bg-surface-container-highest rounded-full appearance-none cursor-pointer" max="10" min="0" type="range" value="8"/>

<span class="text-[10px] font-bold text-outline uppercase tracking-tighter">Insuficiente</span>
<span class="text-[10px] font-bold text-outline uppercase tracking-tighter">Excelente</span>
</div>
</div>
</div>
</div>

<div class="grid grid-cols-4 gap-2">
<div class="w-1 h-1 bg-primary/20 rounded-full"></div>
<div class="w-1 h-1 bg-primary/40 rounded-full"></div>
<div class="w-1 h-1 bg-primary/20 rounded-full"></div>
<div class="w-1 h-1 bg-primary/10 rounded-full"></div>
</div>
</div>
</div>

<p class="mt-8 text-[11px] text-center text-outline leading-tight px-8">

        </p>

<span class="font-['Manrope'] font-semibold text-xs">Voltar</span>
</button>

<span class="material-symbols-outlined mb-1">check_circle</span>
<span class="font-['Manrope'] font-semibold text-xs">Finalizar</span>
</button>
