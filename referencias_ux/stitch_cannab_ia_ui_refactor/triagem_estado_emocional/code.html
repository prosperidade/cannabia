</div>

<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<header class="relative z-10 mb-10">
<h2 class="font-headline text-3xl font-extrabold text-on-surface tracking-tight mb-3">Estado Emocional</h2>
<p class="text-on-surface-variant text-lg font-light leading-relaxed">Como você tem se sentido ultimamente?</p>

<div class="space-y-4 relative z-10">
<!-- Option 1 -->
<button class="w-full group text-left flex items-center justify-between p-5 rounded-2xl border border-white/5 bg-white/5 hover:border-primary/40 hover:bg-white/10 transition-all duration-300">

</div>

</div>
<div class="w-6 h-6 rounded-full border-2 border-outline group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary scale-0 group-hover:scale-100 transition-transform"></div>
</div>
</button>
<!-- Option 2 (Active/Selected State Representation) -->

<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-stone-950">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<span class="font-semibold text-lg text-primary">Ansioso ou Inquieto</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>

</div>
<div class="w-6 h-6 rounded-full border-2 border-outline group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary scale-0 group-hover:scale-100 transition-transform"></div>
