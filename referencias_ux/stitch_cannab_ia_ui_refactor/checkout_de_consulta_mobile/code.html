<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout - The Botanical Laboratory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#0e1606",
                        "on-secondary": "#0e3817",
                        "secondary-fixed": "#bfefbe",
                        "inverse-on-surface": "#2a3320",
                        "on-secondary-fixed": "#002107",
                        "surface-tint": "#aed445",
                        "surface-container-low": "#161e0d",
                        "on-secondary-fixed-variant": "#274f2c",
                        "inverse-surface": "#dce6cb",
                        "tertiary-fixed-dim": "#fcaaff",
                        "surface": "#0e1606",
                        "primary-container": "#a3c93a",
                        "on-surface": "#dce6cb",
                        "tertiary-container": "#f998ff",
                        "on-error": "#690005",
                        "outline-variant": "#444937",
                        "on-tertiary-fixed": "#36003e",
                        "on-background": "#dce6cb",
                        "surface-container-highest": "#2f3824",
                        "secondary-container": "#29522e",
                        "error-container": "#93000a",
                        "on-secondary-container": "#96c496",
                        "surface-bright": "#333c29",
                        "on-tertiary-fixed-variant": "#741e80",
                        "surface-variant": "#2f3824",
                        "on-primary-fixed-variant": "#3a4d00",
                        "tertiary-fixed": "#ffd6fc",
                        "tertiary": "#ffc4fe",
                        "primary": "#bee654",
                        "on-tertiary": "#580064",
                        "inverse-primary": "#4f6700",
                        "secondary-fixed-dim": "#a4d2a4",
                        "surface-container": "#1a2211",
                        "surface-container-high": "#242d1a",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "background": "#0e1606",
                        "on-tertiary-container": "#792484",
                        "outline": "#8f937d",
                        "primary-fixed-dim": "#aed445",
                        "on-surface-variant": "#c5c9b1",
                        "on-primary-container": "#3e5200",
                        "on-primary": "#273500",
                        "secondary": "#a4d2a4",
                        "primary-fixed": "#c9f15e",
                        "on-primary-fixed": "#151f00",
                        "surface-container-lowest": "#091003"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #0e1606;
            color: #dce6cb;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(47, 56, 36, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(163, 201, 58, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 bg-stone-950/80 backdrop-blur-md border-b border-white/10 flex items-center justify-between px-6 h-16 w-full">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[#A3C93A]">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tighter text-[#A3C93A] font-manrope">Checkout</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</nav>
<main class="pt-20 px-6 space-y-6">
<!-- Order Summary Section -->
<section>
<div class="glass-card p-4 rounded-lg flex items-center gap-4">
<div class="h-16 w-16 rounded-full overflow-hidden border-2 border-primary-container/20 flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Professional doctor in a modern clinical setting with soft natural light and greenery in background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdmzs45m6drYJONCJzhl6v7Byz86WlmQNHKisFwHZkIzMRC5Rx0F-l7Ennq_IRHgkRIe65VrF7MDFmxWI646U-rgLWTybDzEtjSfLuxrNJRK899Pw6Ip3NnLE-FlLUi6nWWRSiWV5EJ-Tgqw6Y_07Bytwy89py9OCSlIYSQop47kGe7mqG95mev7aazmReE3oOCQ3I3P7FfFlmdX3Z7UkiRPgtdp9IWImMrswCpxLvq8H_MjyRjvahtrgJ0Y-xPmhG96l5efXTVOpF"/>
</div>
<div class="flex-1">
<h2 class="font-headline font-bold text-lg text-primary leading-tight">Premium Consultation</h2>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-[16px] text-stone-400">calendar_today</span>
<p class="text-xs text-stone-400 font-label">Oct 24, 2023 • 10:30 AM</p>
</div>
</div>
<div class="text-right">
<p class="font-headline font-extrabold text-primary-container">$120.00</p>
</div>
</div>
</section>
<!-- Payment Method Toggle -->
<section class="space-y-3">
<h3 class="text-sm font-bold uppercase tracking-widest text-stone-400 px-1">Payment Method</h3>
<div class="flex p-1 bg-surface-container-highest rounded-full">
<button class="flex-1 py-2 rounded-full text-sm font-bold bg-primary-container text-on-primary-container transition-all">
                    Credit Card
                </button>
<button class="flex-1 py-2 rounded-full text-sm font-bold text-stone-500 hover:text-stone-300 transition-all">
                    PIX
                </button>
</div>
</section>
<!-- Form Fields Section -->
<section class="glass-card p-6 rounded-lg space-y-4">
<div class="space-y-1.5">
<label class="text-[10px] uppercase tracking-widest text-stone-400 font-bold ml-1">Cardholder Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-DEFAULT px-4 py-3 focus:outline-none focus:border-primary-container text-on-surface placeholder:text-stone-600" placeholder="Johnathan Doe" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[10px] uppercase tracking-widest text-stone-400 font-bold ml-1">Card Number</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-DEFAULT pl-4 pr-12 py-3 focus:outline-none focus:border-primary-container text-on-surface placeholder:text-stone-600" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-stone-500">credit_card</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[10px] uppercase tracking-widest text-stone-400 font-bold ml-1">Expiry Date</label>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-DEFAULT px-4 py-3 focus:outline-none focus:border-primary-container text-on-surface placeholder:text-stone-600" placeholder="MM/YY" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[10px] uppercase tracking-widest text-stone-400 font-bold ml-1">CVV</label>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-DEFAULT px-4 py-3 focus:outline-none focus:border-primary-container text-on-surface placeholder:text-stone-600" placeholder="***" type="password"/>
</div>
</div>
</section>
<!-- Discount Coupon -->
<section class="space-y-3">
<div class="flex gap-2">
<input class="flex-1 bg-surface-container-low border border-outline-variant/30 rounded-DEFAULT px-4 py-3 focus:outline-none focus:border-primary-container text-on-surface placeholder:text-stone-600 text-sm" placeholder="Coupon Code" type="text"/>
<button class="bg-surface-container-highest px-6 py-3 rounded-DEFAULT text-sm font-bold text-primary hover:bg-surface-bright transition-colors">
                    Apply
                </button>
</div>
</section>
<!-- Total and Security -->
<section class="py-4 space-y-6">
<div class="flex justify-between items-end border-t border-white/5 pt-6">
<div>
<p class="text-stone-500 text-sm">Total Amount</p>
<p class="text-xs text-stone-600 italic">Taxes and fees included</p>
</div>
<div class="text-right">
<p class="text-4xl font-headline font-extrabold text-[#A3C93A] tracking-tighter">$120.00</p>
</div>
</div>
<div class="flex items-center justify-center gap-4 py-2 opacity-60">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] text-primary">verified_user</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Encrypted</span>
</div>
<div class="h-1 w-1 bg-stone-700 rounded-full"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] text-primary">lock</span>
<span class="text-[10px] uppercase tracking-widest font-bold">SSL Secure</span>
</div>
</div>
</section>
<!-- Final Action Button -->
<div class="pb-12">
<button class="w-full bg-primary-container hover:bg-primary py-5 rounded-lg text-on-primary-container font-headline font-extrabold text-lg flex items-center justify-center gap-3 active:scale-[0.98] transition-all shadow-[0_12px_40px_rgba(163,201,58,0.2)]">
                Finalize Payment
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar (Hidden or Suppressed as per context? Task says within/above BottomNavBar, but suppress rules suggest task-focused pages suppress it. Including it as it's a predicted component but keeping it discreet) -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-stone-950/90 backdrop-blur-xl rounded-t-[2rem] border-t border-white/5 shadow-[0_-8px_30px_rgb(0,0,0,0.5)]">
<div class="flex flex-col items-center justify-center text-stone-500 p-3 hover:text-white transition-colors active:scale-90 duration-300">
<span class="material-symbols-outlined">home</span>
</div>
<div class="flex flex-col items-center justify-center text-stone-500 p-3 hover:text-white transition-colors active:scale-90 duration-300">
<span class="material-symbols-outlined">medical_services</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#A3C93A]/10 text-[#A3C93A] rounded-full p-3 active:scale-90 duration-300">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<div class="flex flex-col items-center justify-center text-stone-500 p-3 hover:text-white transition-colors active:scale-90 duration-300">
<span class="material-symbols-outlined">person</span>
</div>
</footer>
</body></html>
