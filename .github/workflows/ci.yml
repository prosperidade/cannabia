name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas quando o mesmo ref recebe um push novo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Imagem com PostGIS para suportar colunas GEOGRAPHY do schema de
        # traceability (migration 028+, doc 25 §§7.2 e 7.6). Postgres 16
        # mantem paridade com a imagem base anterior; a extension postgis
        # e ativada explicitamente pelo step "Enable PostGIS extension".
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cannabia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cannabia_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cannabia_test
      SECRET_KEY: ci-secret-key-do-not-use-in-production-xx
      ENCRYPTION_KEY: ci-encryption-key-32chars-padding!
      SESSION_COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3001
      # Stubs para os integrations nao quebrarem no import:
      META_WHATSAPP_KEY: ci-stub
      WHATSAPP_PHONE_NUMBER_ID: ci-stub
      WHATSAPP_APP_SECRET: ci-stub
      VERIFY_TOKEN: ci-stub
      OPENAI_API_KEY: ci-stub
      GOOGLE_API_KEY: ci-stub

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Enable PostGIS extension
        # Defensivo: a migration 028 ja faz CREATE EXTENSION IF NOT EXISTS postgis
        # como primeira instrucao, mas executar aqui isola a falha (se houver) num
        # step dedicado em vez de mascarada dentro do log do runner de migrations.
        # Idempotente: no-op em DB que ja tem a extension.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d cannabia_test \
               -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Apply migrations
        run: python scripts/run_migrations.py

      - name: Run pytest
        run: pytest -q

  # O job de frontend foi promovido para .github/workflows/frontend-ci.yml
  # (path-filtered em frontend/**), onde roda o pipeline completo:
  # npm ci · lint · format:check · tsc --noEmit · build. Mantê-lo aqui
  # duplicaria o type-check e rodaria Node em todo PR só-de-backend.
