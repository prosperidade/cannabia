  - id: observational_studies/cohort_study
    category: observational_studies
    title: Estudo Observacional de Cohort por Condicao Clinica
    description: >-
      Estudo retrospectivo deterministico construido sobre o Evidence
      Engine (F4.1). Agrega cohort de pacientes em tratamento para uma
      condicao, computa correlacao dose-efeito (mean ponderada por N de
      amostras), classifica respostas de follow-up (D+3/D+7/D+15) em
      improved/unchanged/worsened, e documenta metodologia + parametros
      para reprodutibilidade. Saida sem AI no caminho.
    current_version: v1
    versions:
