# Biblioteca de Templates Regulatorios — Registry Central
# Referencia: docs/27_REGULATORY_TEMPLATES_LIBRARY.md §3.4
#
# Este arquivo e o manifesto unico da biblioteca. Define:
#  - Templates ativos, depreciados ou em revisao.
#  - Versao corrente de cada template (semver: major.minor.patch via pasta vX).
#  - Vinculo com normas regulatorias (RDC 1.014/2026 + secoes do doc 27).
#  - Log de mudancas por versao.
#  - Roadmap de templates planejados (F4.5/F4.6/F4.7).
#
# Consumido por: src/services/template_engine.py (F4.4, proximo).
# Interface prevista: render(template_id, context, format='md')
#  -> resolve template_id aqui, busca current_version.file, renderiza.

registry_version: "1.0"
last_updated: "2026-04-21"

# Engine de renderizacao padronizada pela biblioteca (doc 27 §3.2).
engine:
  name: jinja2
  defaults:
    undefined: strict           # StrictUndefined — falha em campo ausente
    trim_blocks: true
    lstrip_blocks: true
    autoescape: false           # Markdown, nao HTML
  template_base_dir: data/templates

# Formatos de saida suportados pela renderizacao (doc 27 §8.1 passo 6).
# 'md' e sempre intermediario; 'pdf'/'docx' exigem conversores em F4.4+.
output_formats:
  - md
  # - pdf   # TODO F4.4: conversor md -> PDF/A para submissao oficial
  # - docx  # TODO F4.4: conversor md -> DOCX para edicao

# --------------------------------------------------------------------
# Categorias conforme estrutura de diretorios (doc 27 §3.1)
# --------------------------------------------------------------------
categories:
  eligibility:
    path: eligibility
    description: Dossie de Elegibilidade ao Sandbox.
  project_plans:
    path: project_plans
    description: Cinco planos obrigatorios do Projeto Experimental (RDC Art. 9).
  operational:
    path: operational
    description: Documentos operacionais (consentimento, rotulo, POP).
  final:
    path: final
    description: Parecer Final e Relatorio Tecnico-Regulatorio consolidado.
  common:
    path: common
    description: Partials e estilos reutilizaveis.

# --------------------------------------------------------------------
# Templates ativos
# --------------------------------------------------------------------
# Cada template tem:
#  - id: chave estavel usada pelo template_engine
#  - category: um dos valores em `categories`
#  - current_version: versao atual (chave em `versions`)
#  - versions: dict de versoes com metadata completa
#
# Status admitidos por versao: active | under_review | deprecated
# (doc 27 §9.3 — depreciadas permanecem no registry; nao geram documento novo).

templates:

  - id: eligibility/dossier
    category: eligibility
    title: Dossie de Elegibilidade ao Sandbox Regulatorio
    description: >-
      Documento apresentado a ANVISA na submissao ao Edital, atestando que
      a associacao cumpre os requisitos de elegibilidade do Sandbox.
      Meta operacional: >=90% dos campos auto-preenchidos (doc 27 §5.4).
    current_version: v1
    versions:
      v1:
        file: eligibility/dossier_v1.md.j2
        schema: null               # F4.4: definir schema_v1.yaml formal
        status: active
        activated_at: "2026-04-20"
        deprecated_at: null
        output_formats: [md]
        renderer:
          builder: src.services.governance_dossier.build_dossier_data
          # F4.4 movera a renderizacao para template_engine generico;
          # build_dossier_data continua como provider de contexto.
        regulatory_refs:
          - source: RDC 1.014/2026
            articles: [Art. 7]
            note: requisitos de elegibilidade da associacao
          - source: doc 27
            sections: [§5]
        data_sources:
          - tenants
          - associations
          - institutional_documents
          - technical_responsibles
          - technical_operational_capacity
        changelog:
          - date: "2026-04-20"
            type: initial
            notes: >-
              Versao inicial (F1.5 parte 2). 10 secoes conforme doc 27 §5.2.
              Renderer atual em src/services/governance_dossier.py.
          - date: "2026-04-21"
            type: refactor
            notes: >-
              F4.6 — governance_dossier.render_dossier_markdown passa a
              delegar para template_engine.render. Output identico,
              expoe agora content_hash SHA-256 via render_dossier_document.

  - id: final/monitoring_opinion
    category: final
    title: Parecer Final de Monitoramento do Experimento
    description: >-
      Consolida resultados, indicadores, evidencias e ancoragens do
      Projeto Experimental (RDC Art. 20). Construido incrementalmente
      (trimestral + consolidacao final — doc 27 §6.4).
    current_version: v1
    versions:
      v1:
        file: final/monitoring_opinion_v1.md.j2
        schema: null
        status: active
        activated_at: "2026-04-21"
        deprecated_at: null
        output_formats: [md]
        renderer:
          builder: src.services.regulatory_documents.build_monitoring_opinion_data
        regulatory_refs:
          - source: RDC 1.014/2026
            articles: [Art. 20]
            note: parecer final do experimento
          - source: doc 27
            sections: [§6]
        data_sources:
          - sandbox_projects
          - sandbox_indicators
          - sandbox_indicator_values
          - traceability_events
          - adverse_events
          - blockchain_anchors
        changelog:
          - date: "2026-04-21"
            type: initial
            notes: >-
              Esqueleto das 14 secoes do §6.2 com placeholders [pendencia]
              em agregados que dependem do Evidence Engine (F4.1) e do
              schema financeiro.

  - id: operational/consent_form
    category: operational
    title: Termo de Consentimento Informado do Associado
    description: >-
      Documento de adesao do associado ao Projeto Experimental, com
      LGPD, vedacoes do Sandbox e direitos (doc 27 §7.1).
    current_version: v1
    versions:
      v1:
        file: operational/consent_form_v1.md.j2
        schema: null
        status: active
        activated_at: "2026-04-21"
        deprecated_at: null
        output_formats: [md]
        renderer:
          builder: src.services.regulatory_documents.build_consent_form_data
        regulatory_refs:
          - source: doc 27
            sections: [§7.1]
          - source: LGPD
            note: base legal e direitos do titular
        data_sources:
          - tenants
          - association_members
          - sandbox_projects
          - technical_responsibles
        changelog:
          - date: "2026-04-21"
            type: initial
            notes: 8 partes conforme §7.1 com LGPD e compartilhamento ANVISA.

  - id: operational/label_warning
    category: operational
    title: Rotulo e Advertencia de Preparados
    description: >-
      Rotulo para cada lote de preparado, com perfil canabinoide,
      advertencias de Sandbox (nao e medicamento, sem publicidade) e
      QR code de verificacao publica (doc 27 §7.2).
    current_version: v1
    versions:
      v1:
        file: operational/label_warning_v1.md.j2
        schema: null
        status: active
        activated_at: "2026-04-21"
        deprecated_at: null
        output_formats: [md]
        renderer:
          builder: src.services.regulatory_documents.build_label_warning_data
        regulatory_refs:
          - source: doc 27
            sections: [§7.2]
        data_sources:
          - preparations
          - tenants
          - technical_responsibles
          - blockchain_anchors
        changelog:
          - date: "2026-04-21"
            type: initial
            notes: >-
              Markdown intermediario — o PDF final agrega QR code visual
              apontando para GET /api/v1/public/anchors/<t>/verify (F5.5).

  - id: operational/sop_template
    category: operational
    title: Template-Base de POP
    description: >-
      Estrutura minima para criacao de novos Procedimentos Operacionais
      Padrao (doc 27 §7.3). O conteudo substantivo e preenchido pelo
      autor do POP; este template garante aderencia a norma.
    current_version: v1
    versions:
      v1:
        file: operational/sop_template_v1.md.j2
        schema: null
        status: active
        activated_at: "2026-04-21"
        deprecated_at: null
        output_formats: [md]
        renderer:
          builder: src.services.regulatory_documents.build_sop_template_data
        regulatory_refs:
          - source: doc 27
            sections: [§7.3]
          - source: ABNT
            note: estrutura compativel com normas de gestao documental
        data_sources:
          - sops
          - sop_versions
        changelog:
          - date: "2026-04-21"
            type: initial
            notes: >-
              9 secoes estruturais para compor novos POPs. NAO e documento
              de producao — e o molde usado para instanciar POPs concretos.

