# render.yaml — Infraestrutura como Código para o Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cannabia-api
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m src.infra.run_migrations
    startCommand: gunicorn -c gunicorn.conf.py "src.app:app"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cannabia-db
          property: connectionString
      - key: FLASK_ENV
        value: "production"
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: META_WHATSAPP_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: RECIPIENT_PHONE
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: WEBHOOK_RATE_LIMIT
        value: "60"
      - key: WEBHOOK_RATE_WINDOW_S
        value: "60"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW_S
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "262144"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: FF_BILLING_ENABLED
        value: "true"
      - key: PAYMENT_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: PAYMENT_WEBHOOK_SECRET_MERCADOPAGO
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET_ASAAS
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET_PAGSEGURO
        sync: false
      # Sprint 2 Track Obs — Sentry observabilidade (LGPD-safe via before_send)
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_SAMPLE_RATE
        value: "1.0"

  - type: web
    name: cannabia-frontend
    runtime: node
    region: ohio
    plan: starter
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: CANNABIA_API_HOSTPORT
        fromService:
          type: web
          name: cannabia-api
          property: hostport

databases:
  - name: cannabia-db
    plan: basic-256mb
    region: ohio
    databaseName: cannabia
    postgresMajorVersion: "18"
