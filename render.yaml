# render.yaml — Infraestrutura como Código para o Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cannabia-api
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m src.infra.run_migrations
    startCommand: >
      gunicorn
      --worker-class eventlet
      --workers 1
      --timeout 120
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --error-logfile -
      "src.app:app"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cannabia-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: META_WHATSAPP_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RECIPIENT_PHONE
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: WEBHOOK_RATE_LIMIT
        value: "60"
      - key: WEBHOOK_RATE_WINDOW_S
        value: "60"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW_S
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "262144"

  - type: web
    name: cannabia-frontend
    runtime: node
    region: ohio
    plan: starter
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: CANNABIA_API_HOSTPORT
        fromService:
          type: web
          name: cannabia-api
          property: hostport

databases:
  - name: cannabia-db
    plan: basic-256mb
    region: ohio
    databaseName: cannabia
    postgresMajorVersion: "18"
