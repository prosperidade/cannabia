# render.yaml — Infraestrutura como Código para o Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cannabia-api
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m src.infra.run_migrations
    startCommand: gunicorn -c gunicorn.conf.py "src.app:app"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cannabia-db
          property: connectionString
      - key: FLASK_ENV
        value: "production"
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: META_WHATSAPP_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: RECIPIENT_PHONE
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: WEBHOOK_RATE_LIMIT
        value: "60"
      - key: WEBHOOK_RATE_WINDOW_S
        value: "60"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW_S
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "262144"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: FF_BILLING_ENABLED
        value: "true"
      - key: PAYMENT_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: PAYMENT_WEBHOOK_SECRET_MERCADOPAGO
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET_ASAAS
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET_PAGSEGURO
        sync: false
      # Sprint 2 Track Obs — Sentry observabilidade (LGPD-safe via before_send)
      # Sprint 3 Track Obs-Harden — SENTRY_DSN agora OBRIGATORIO em prod —
      # raise se ausente (ver src/config.py::_get_sentry_config).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_SAMPLE_RATE
        value: "1.0"
      # Sprint 3 Track Obs-Harden — performance traces piloto 10% (Q-OH-2).
      # Aumentar/reduzir via Render dashboard conforme quota Sentry free tier
      # (10k transactions/mes). Calibrar Sprint 4.
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # INFRA-1 (doc 30 Onda 1): URL da fila assincrona (Redis). O web so
      # ENFILEIRA; o processamento e do worker abaixo. Cutover sincrono->async
      # e Onda 2 (INFRA-2) — por ora a fila fica provisionada e ociosa.
      - key: REDIS_URL
        fromService:
          type: redis
          name: cannabia-redis
          property: connectionString

  # INFRA-1: Redis (Key Value) — backend da fila RQ.
  # NOTA: o Render renomeou "Redis" para "Key Value"; se o blueprint recusar
  # `type: redis`, troque para `type: keyvalue` (mesmos campos).
  - type: redis
    name: cannabia-redis
    region: ohio
    plan: starter
    maxmemoryPolicy: noeviction   # fila: nunca despejar jobs por pressao de memoria
    ipAllowList: []               # acesso apenas interno (rede privada do Render)

  # INFRA-1: worker RQ que consome a fila cannabia-ai (src/infra/tasks.py).
  # Roda o pipeline de IA em background quando o cutover (Onda 2) ligar os
  # call-sites. Provisionado agora para validar a infra ponta-a-ponta.
  - type: worker
    name: cannabia-ai-worker
    runtime: python
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker cannabia-ai --url $REDIS_URL
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cannabia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cannabia-redis
          property: connectionString
      - key: FLASK_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # Sprint 2 Track LGPD: retention policy automatizada para ai_audit_logs.
  # Roda diariamente as 04:00 UTC (01:00 BRT) — janela de baixo trafego.
  # AVISO: prazos de retencao precisam de OK juridico antes do primeiro
  # production run. Ver docs/LGPD_OPERATIONS.md.
  - type: cron
    name: cannabia-audit-retention
    env: python
    region: ohio
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.retention_audit_logs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cannabia-db
          property: connectionString
      # Kill switch: cron eh agendado mas roda como no-op enquanto false.
      # Vire "true" no Render dashboard apos OK juridico (Q-LGPD-2).
      - key: LGPD_PURGE_ENABLED
        value: "false"
      - key: LGPD_AUDIT_RETENTION_DAYS_DETAIL
        value: "90"
      - key: LGPD_AUDIT_RETENTION_DAYS_CRITICAL
        value: "365"
      - key: LGPD_AUDIT_ARCHIVE_RETENTION_DAYS
        value: "1825"

  - type: web
    name: cannabia-frontend
    runtime: node
    region: ohio
    plan: starter
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: CANNABIA_API_HOSTPORT
        fromService:
          type: web
          name: cannabia-api
          property: hostport

databases:
  - name: cannabia-db
    plan: basic-256mb
    region: ohio
    databaseName: cannabia
    postgresMajorVersion: "18"
