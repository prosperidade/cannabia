    description: Padroes de conversa, taxa de conclusao de anamnese, abandono

  - name: crm_telemetria
    description: Follow-up patterns, IoT readings, diary correlations

  - name: multi_tenant
    description: Padroes anonimizados entre clinicas (dosagem media, condicoes top)

  # --- Desenvolvimento ---
  - name: backend
    description: Flask routes, migrations, infra decisions

  - name: frontend
    description: Next.js pages, components, design system
